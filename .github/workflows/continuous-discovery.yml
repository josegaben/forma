name: Continuous Web Format & Motion Discovery

on:
  schedule:
    # Scrape curated galleries & benchmark designs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run forma-xray Continuous Gallery Crawler
        run: node scripts/continuous-crawler.mjs

      - name: Commit newly discovered high-craft formats
        run: |
          git config user.name "forma-discovery-bot"
          git config user.email "bot@forma.to"
          git add src/data/discovered-feed.json
          git diff --staged --quiet || git commit -m "chore(radar): update continuously scraped web formats & motion telemetry"
          git push
