name: Core Web Vitals & GPU Compositor CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cwv-and-gpu-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies & Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium

      - name: TypeScript & Production Build Check
        run: |
          npm run lint
          npm run build

      - name: Assert CLS = 0.000 & 100% GPU-Composited Animations
        run: |
          npx next start -p 3030 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3030/ > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          BASE_URL=http://localhost:3030 node scripts/audit-cwv.mjs
          kill $SERVER_PID || true
